<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotterAI – Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="home-page">
  <header class="nav">
    <a href="home.html" class="logo">SpotterAI</a>
    <ul class="nav-links">
      <li>
        <button onclick="location.href='home.html'" class="member-logout-btn">
          Home
        </button>
      </li>
      <li>
        <button onclick="location.href='member.html'" class="member-logout-btn">
          Chat
        </button>
      </li>
    </ul>
  </header>

  <main class="page">
    <section class="profile-container">

      <div class="profile-card">
        <img src="avatarimg.png" alt="User Avatar" class="avatar" />

        <h1 class="profile-name">User</h1>
        <p class="profile-sub">Training with SpotterAI</p>

        <div class="profile-stats">
          <div class="stat">
            <span class="stat-number">—</span>
            <span class="stat-label">Workouts Logged</span>
          </div>
          <div class="stat">
            <span class="stat-number">—</span>
            <span class="stat-label">Calories Tracked</span>
          </div>
          <div class="stat">
            <span class="stat-number">—</span>
            <span class="stat-label">Goals Set</span>
          </div>
        </div>
      </div>

      <div class="profile-section">
        <h2>Fitness Goals</h2>
        <span>Goal: </span>
        <strong id="profile-goal">--</strong>
      </div>

      <div class="profile-section">
        <h2>Preferences</h2>
        <div class="member-profile-list">
          <div class="member-profile-row">
            <span>Name</span>
            <strong id="profile-name">--</strong>
          </div>

          <div class="member-profile-row">
            <span>Age</span>
            <strong id="profile-age">--</strong>
          </div>

          <div class="member-profile-row">
            <span>Weight</span>
            <strong id="profile-weight">--</strong>
          </div>

          <div class="member-profile-row">
            <span>Height</span>
            <strong id="profile-height">--</strong>
          </div>

          <div class="member-profile-row">
            <span>Sex</span>
            <strong id="profile-sex">--</strong>
          </div>
        </div>
      </div>

    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = 'https://ezowjohfkxvaajeqilkx.supabase.co';
    const supabaseAnonKey = 'sb_publishable__ajmqfcEBopf6B-aKLIzuw_XmyvssUq';
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    async function loadProfile() {
      try {
        const { data: userData, error: userError } = await supabase.auth.getUser();

        if (userError || !userData?.user) {
          window.location.href = 'login.html';
          return;
        }

        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', userData.user.id)
          .single();

        if (profileError || !profile) {
          console.error('Error loading profile:', profileError);
          return;
        }

        // Main card name
        document.querySelector('.profile-name').textContent =
          profile.full_name || profile.display_name || 'User';

        // Goal
        document.getElementById('profile-goal').textContent =
          profile.goals || profile.fitness_goal || 'No goals added yet.';

        // Preferences
        document.getElementById('profile-name').textContent =
          profile.full_name || profile.display_name || '--';

        document.getElementById('profile-age').textContent =
          profile.age || '--';

        document.getElementById('profile-weight').textContent =
          profile.weight ? `${profile.weight} lbs` : '--';

        document.getElementById('profile-height').textContent =
          profile.height ? `${profile.height} in` : '--';

        document.getElementById('profile-sex').textContent =
          profile.sex || '--';

        // Stats
        const statNumbers = document.querySelectorAll('.stat-number');
        statNumbers[0].textContent = profile.workouts || '—';
        statNumbers[1].textContent = profile.calories || '—';
        statNumbers[2].textContent =
          (profile.goals || profile.fitness_goal) ? '1' : '0';
      } catch (error) {
        console.error('Unexpected error loading profile:', error);
      }
    }

    loadProfile();
  </script>
</body>
</html>
