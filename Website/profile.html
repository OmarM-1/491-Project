<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotterAI – Profile</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="home-page">
<body class="home-page">
        <header class="nav">       
        <a href="home.html" class="logo">SpotterAI</a>  
                <ul class="nav-links">
                    <li><a href="profile.html"> Profile </a></li>
                    <li><a href="member.html"> Chat </a></li>
                    <li><a href="saved_workouts.html"> Saved Workouts </a></li>
                </ul>
        </header>
  <!-- Main page container (uses .page from your CSS) -->
  <main class="page">

    <section class="profile-container">

      <div class="profile-card">
        <img src="avatarimg.png" alt="User Avatar" class="avatar">


        <h1 class="profile-name"> User</h1>
        <p class="profile-sub">Training with SpotterAI</p>

        <div class="profile-stats">
          <div class="stat">
            <span class="stat-number">—</span>
            <span class="stat-label">Workouts Logged</span>
          </div>
          <div class="stat">
            <span class="stat-number">—</span>
            <span class="stat-label">Calories Tracked</span>
          </div>
          <div class="stat">
            <span class="stat-number">—</span>
            <span class="stat-label">Goals Set</span>
          </div>
        </div>
      </div>

      <div class="profile-section">
        <h2>Fitness Goals</h2>
        <p class="placeholder">No goals added yet.</p>
      </div>

      <div class="profile-section">
        <h2>Preferences</h2>
        <p class="placeholder">No preferences saved.</p>
      </div>

    </section>

  </main>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const supabaseUrl = 'https://ezowjohfkxvaajeqilkx.supabase.co';
  const supabaseAnonKey = 'sb_publishable__ajmqfcEBopf6B-aKLIzuw_XmyvssUq';
  const supabase = createClient(supabaseUrl, supabaseAnonKey);

  async function loadProfile() {
    const { data: userData } = await supabase.auth.getUser();
    if (!userData?.user) return;

    const { data: profile } = await supabase
      .from("profiles")
      .select("*")
      .eq("id", userData.user.id)
      .single();

    // Update name
    document.querySelector(".profile-name").textContent =
      profile?.full_name || "User";

    // Update goals
    document.querySelectorAll(".profile-section")[0]
      .querySelector(".placeholder").textContent =
      profile?.goals || "No goals added yet.";

    // Update preferences
    document.querySelectorAll(".profile-section")[1]
      .querySelector(".placeholder").textContent =
      profile?.preferences || "No preferences saved.";

    // Update stats (placeholder for now)
    document.querySelectorAll(".stat-number")[0].textContent = profile?.workouts || "—";
    document.querySelectorAll(".stat-number")[1].textContent = profile?.calories || "—";
    document.querySelectorAll(".stat-number")[2].textContent = profile?.goals ? "1" : "0";
  }

  loadProfile();
</script>
</body>
</html>
