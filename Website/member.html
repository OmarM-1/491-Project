<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotter AI - Member</title>
  <link rel="icon" type="image/png" sizes="16x16" href="SpotterAI-Robot-favicon.png">

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>

<body class="home-page">
  <header class="nav">
    <a href="member.html" class="logo">SpotterAI</a>

    <ul class="nav-links">
      <li><button onclick="location.href='profile.html'" class="member-logout-btn">Profile</button></li>
      <li><button id="logout-btn" class="member-logout-btn">Log out</button></li>
    </ul>
  </header>

  <main class="member-layout">
    <aside class="member-sidebar">
      <section class="member-profile-card">
        <p class="member-label">Member Dashboard</p>
        <h2 id="member-heading">Loading member...</h2>
        <p id="member-subtitle" class="member-muted">Loading your profile...</p>

        <div class="member-profile-list">
          <div class="member-profile-row">
            <span>Name</span>
            <strong id="profile-name">--</strong>
          </div>

          <div class="member-profile-row">
            <span>Age</span>
            <strong id="profile-age">age</strong>
          </div>

          <div class="member-profile-row">
            <span>Weight</span>
            <strong id="profile-weight">--</strong>
          </div>

          <div class="member-profile-row">
            <span>Height</span>
            <strong id="profile-height">--</strong>
          </div>

          <div class="member-profile-row">
            <span>Sex</span>
            <strong id="profile-sex">--</strong>
          </div>
          <div class="member-profile-row">
            <span>Goal</span>
            <strong id="profile-goal">--</strong>
          </div>
        </div>
      </section>

      <section class="member-profile-card">
        <p class="member-label">Quick prompts</p>
        <div class="member-prompt-list">
          <button class="member-prompt-btn" data-prompt="Create a workout plan based on my goal.">Workout plan</button>
          <button class="member-prompt-btn" data-prompt="Estimate my calories and protein for my goal.">Calories & protein</button>
          <button class="member-prompt-btn" data-prompt="Give me a simple weekly plan based on my profile.">Weekly plan</button>
        </div>
      </section>

      <section class="member-profile-card">
        <div class="conversations-header">
          <p class="member-label">Conversations</p>
          <button id="new-chat-btn" class="new-chat-btn" title="New conversation">+ New</button>
        </div>
        <div id="conversations-list" class="conversations-list">
          <p class="conversations-empty">No conversations yet.</p>
        </div>
      </section>
    </aside>

    <section class="member-chat-area">
      <div class="member-chat-header">
        <div>
          <p class="member-label">Personalized Chat</p>
          <h1>SpotterAI Coach</h1>
          <p class="member-muted">Your chat responses can use your saved profile information.</p>
        </div>
      </div>

      <div id="chat-window" class="chat-window member-chat-window"></div>

<div class="chat-input-wrapper member-chat-input">

  <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none">

  <button id="upload-button" aria-label="Upload File">
    <img src="paperclip-icon.png" alt="Upload" style="width:22px;">
  </button>

  <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;">
    <div id="attachment-preview" style="display:none;align-items:center;gap:8px;padding:6px 10px;background:rgba(255,255,255,0.08);border-radius:10px;font-size:0.8rem;">
      <span id="attachment-thumb" style="flex-shrink:0;"></span>
      <span id="attachment-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;opacity:0.85;"></span>
      <button id="attachment-remove" aria-label="Remove attachment" style="background:none;border:none;cursor:pointer;opacity:0.6;font-size:1rem;padding:0;line-height:1;flex-shrink:0;">✕</button>
    </div>

    <textarea
      class="chat-input"
      id="chat-input"
      placeholder="Ask a personalized question..."
      rows="1"
    ></textarea>
  </div>

  <button id="send-button" aria-label="Send">
    <img src="up-arrow-icon.webp" alt="Send">
  </button>
</div>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = 'https://ezowjohfkxvaajeqilkx.supabase.co';
    const supabaseAnonKey = 'sb_publishable__ajmqfcEBopf6B-aKLIzuw_XmyvssUq';
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    const textarea = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');
    const chatWindow = document.getElementById('chat-window');

    let currentUser = null;
    let currentProfile = null;
    let accessToken = null;
    let threadId = localStorage.getItem('spotter_thread_id') || null;

    // ── Conversation list ────────────────────────────────────────

    async function loadConversationList() {
      if (!accessToken) return;
      const res = await fetch('http://localhost:8000/threads', {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });
      const data = await res.json();
      renderConversationList(data.threads || []);
    }

    function renderConversationList(threads) {
      const list = document.getElementById('conversations-list');
      if (!threads.length) {
        list.innerHTML = '<p class="conversations-empty">No conversations yet.</p>';
        return;
      }
      list.innerHTML = threads.map(t => {
        const label = t.title || 'New conversation';
        const active = t.id === threadId ? ' active' : '';
        return `<button class="conversation-item${active}" data-id="${t.id}" title="${label}">${label}</button>`;
      }).join('');

      list.querySelectorAll('.conversation-item').forEach(btn => {
        btn.addEventListener('click', () => switchConversation(btn.dataset.id));
      });
    }

    async function switchConversation(id) {
      threadId = id;
      localStorage.setItem('spotter_thread_id', threadId);
      chatWindow.innerHTML = '';
      await loadChatHistory();
      // Re-render list to update active highlight
      await loadConversationList();
    }

    function startNewConversation() {
      threadId = null;
      localStorage.removeItem('spotter_thread_id');
      chatWindow.innerHTML = '';
      appendMessage(
        'assistant',
        `Hi ${currentProfile?.display_name?.split(' ')[0] || 'there'} — starting a new conversation. What can I help you with?`
      );
      // Re-render list (no active item)
      loadConversationList();
    }

    // ── History loader ───────────────────────────────────────────

    async function loadChatHistory() {
      if (!accessToken) return;

      // If no stored thread, ask the backend for the latest one
      if (!threadId) {
        const res = await fetch('http://localhost:8000/threads/latest', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await res.json();
        if (data.thread_id) {
          threadId = data.thread_id;
          localStorage.setItem('spotter_thread_id', threadId);
        }
      }

      if (!threadId) return;

      const res = await fetch(`http://localhost:8000/history/${threadId}`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });
      const data = await res.json();
      const messages = data.messages || [];

      if (messages.length) {
        chatWindow.innerHTML = '';
        messages.forEach(({ role, content }) => appendMessage(role, content));
      }
    }

    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.classList.add('chat-message-row', role);

      const bubble = document.createElement('div');
      bubble.classList.add('chat-bubble', role);

      if (role === 'assistant') {
        // Render markdown and sanitize to prevent XSS
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        bubble.textContent = text;
      }

      row.appendChild(bubble);
      chatWindow.appendChild(row);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function setField(id, value) {
      document.getElementById(id).textContent =
        value !== null && value !== undefined && value !== '' ? value : '--';
    }

    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    });

    sendButton.addEventListener('click', handleSend);

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    document.querySelectorAll('.member-prompt-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        textarea.value = btn.dataset.prompt;
        textarea.focus();
      });
    });

    // ── Staged attachment ────────────────────────────────────────
    let stagedFile = null;
    let stagedObjectURL = null;

    function clearStagedFile() {
      stagedFile = null;
      if (stagedObjectURL) { URL.revokeObjectURL(stagedObjectURL); stagedObjectURL = null; }
      document.getElementById("mediaInput").value = "";
      document.getElementById("attachment-preview").style.display = "none";
      document.getElementById("attachment-thumb").innerHTML = "";
      document.getElementById("attachment-name").textContent = "";
    }

    document.getElementById("upload-button").addEventListener("click", () => {
      document.getElementById("mediaInput").click();
    });

    document.getElementById("mediaInput").addEventListener("change", () => {
      const file = document.getElementById("mediaInput").files[0];
      if (!file) return;

      clearStagedFile();
      stagedFile = file;
      stagedObjectURL = URL.createObjectURL(file);

      // Show preview chip in the input bar
      const thumb = document.getElementById("attachment-thumb");
      if (file.type.startsWith("video/")) {
        thumb.innerHTML = `<span style="font-size:1.2rem;">🎬</span>`;
      } else {
        thumb.innerHTML = `<img src="${stagedObjectURL}" style="width:32px;height:32px;object-fit:cover;border-radius:6px;">`;
      }
      document.getElementById("attachment-name").textContent = file.name;
      document.getElementById("attachment-preview").style.display = "flex";

      textarea.placeholder = "Describe what you want feedback on...";
      textarea.focus();
    });

    document.getElementById("attachment-remove").addEventListener("click", () => {
      clearStagedFile();
      textarea.placeholder = "Ask a personalized question...";
    });


    async function loadMemberProfile() {
      const { data: userData, error: userError } = await supabase.auth.getUser();

      if (userError || !userData.user) {
        window.location.href = 'login.html';
        return;
      }

      currentUser = userData.user;

      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      if (profileError || !profile) {
        window.location.href = 'signup.html';
        return;
      }

      currentProfile = profile;

      const { data: sessionData } = await supabase.auth.getSession();
      accessToken = sessionData.session?.access_token ?? null;

      console.log('Profile loaded:', profile);

      setField('profile-name', profile.display_name);
      setField('profile-goal', profile.fitness_goal);
      setField('profile-age', profile.age);
      setField('profile-weight', profile.weight ? `${profile.weight} lbs` : '');
      setField('profile-height', profile.height ? `${profile.height} in` : '');
      setField('profile-sex', profile.sex);

      document.getElementById('member-heading').textContent =
        `Welcome back, ${profile.display_name || 'Member'}`;

      document.getElementById('member-subtitle').textContent =
        `Goal: ${profile.fitness_goal || 'Not set'}`;

      await loadChatHistory();
      await loadConversationList();

      if (!chatWindow.querySelector('.chat-message-row')) {
        appendMessage(
          'assistant',
          `Hi ${profile.display_name?.split(' ')[0] || 'there'} — I can use your profile to help with workouts, nutrition, and your ${profile.fitness_goal || 'fitness'} goal.`
        );
      }

      document.getElementById('new-chat-btn').addEventListener('click', startNewConversation);
    }

    async function handleSend() {
      const question = textarea.value.trim();
      if (!currentProfile) return;
      if (!question && !stagedFile) return;

      textarea.value = '';
      textarea.style.height = 'auto';
      textarea.placeholder = 'Ask a personalized question...';

      const loadingRow = document.createElement('div');
      loadingRow.classList.add('chat-message-row', 'assistant');
      const loadingBubble = document.createElement('div');
      loadingBubble.classList.add('chat-bubble', 'assistant');
      loadingRow.appendChild(loadingBubble);

      if (stagedFile) {
        // ── Media send ──────────────────────────────────────────
        const file = stagedFile;
        const objectURL = stagedObjectURL;

        // Show media preview + prompt in user bubble
        const previewRow = document.createElement('div');
        previewRow.classList.add('chat-message-row', 'user');
        const previewBubble = document.createElement('div');
        previewBubble.classList.add('chat-bubble', 'user');

        if (file.type.startsWith('video/')) {
          const vid = document.createElement('video');
          vid.src = objectURL;
          vid.controls = true;
          vid.style.cssText = 'max-width:260px;max-height:200px;border-radius:8px;display:block;';
          previewBubble.appendChild(vid);
        } else {
          const img = document.createElement('img');
          img.src = objectURL;
          img.alt = file.name;
          img.style.cssText = 'max-width:260px;max-height:200px;border-radius:8px;display:block;';
          previewBubble.appendChild(img);
        }
        if (question) {
          const caption = document.createElement('p');
          caption.style.cssText = 'margin:6px 0 0;font-size:0.9rem;';
          caption.textContent = question;
          previewBubble.appendChild(caption);
        }
        previewRow.appendChild(previewBubble);
        chatWindow.appendChild(previewRow);

        clearStagedFile();

        loadingBubble.textContent = 'Analyzing...';
        chatWindow.appendChild(loadingRow);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
          const formData = new FormData();
          formData.append('files', file);
          if (question) formData.append('message', question);
          if (threadId) formData.append('thread_id', threadId);

          const res = await fetch('http://localhost:8000/chat-with-media', {
            method: 'POST',
            headers: accessToken ? { 'Authorization': `Bearer ${accessToken}` } : {},
            body: formData,
          });

          const data = await res.json();
          loadingRow.remove();

          if (data.thread_id) {
            const isNew = threadId !== data.thread_id;
            threadId = data.thread_id;
            localStorage.setItem('spotter_thread_id', threadId);
            if (isNew) loadConversationList();
          }

          appendMessage('assistant', data.error ? `Error: ${data.error}` : data.answer);
        } catch (err) {
          loadingBubble.textContent = `Connection error — ${err.message}`;
        }

      } else {
        // ── Text-only send ──────────────────────────────────────
        appendMessage('user', question);

        loadingBubble.textContent = 'Thinking...';
        chatWindow.appendChild(loadingRow);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
          const res = await fetch('http://localhost:8000/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(accessToken ? { 'Authorization': `Bearer ${accessToken}` } : {})
            },
            body: JSON.stringify({ message: question, thread_id: threadId })
          });

          if (!res.ok) throw new Error(`Server error: ${res.status}`);

          const data = await res.json();
          loadingRow.remove();

          if (data.thread_id) {
            const isNew = threadId !== data.thread_id;
            threadId = data.thread_id;
            localStorage.setItem('spotter_thread_id', threadId);
            if (isNew) loadConversationList();
          }

          appendMessage('assistant', data.error ? `Error: ${data.error}` : data.answer);
        } catch (err) {
          loadingBubble.textContent = `Connection error — is the API running? (${err.message})`;
        }
      }
    }

    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      localStorage.removeItem('spotter_thread_id');
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    });

    loadMemberProfile();
  </script>
</body>
</html>
