<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotter AI - Guest</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">
</head>

<body class="home-page">
  <header class="nav">       
        <a href="home.html" class="logo">SpotterAI</a>  
                <ul class="nav-links">
                    <li><a href="profile.html"> Profile </a></li>
                    <li><a href="saved_meal_plans.html"> Meal plans </a></li>
                    <li><a href="saved_workouts.html"> Saved Workouts </a></li>
                </ul>
        </header>
  </header>


  <main class="page_guest">
    <section class="hero">
      <h1>(Guest) SpotterAI</h1>
      <p>Ask a question about training or nutrition.</p>

      <!-- CHAT MESSAGES AREA -->
      <div id="chat-window" class="chat-window">
        <!-- Messages will be appended here by JS -->
      </div>

      <!-- INPUT AREA -->
      <div class="chat-input-wrapper">
        <textarea
          class="chat-input"
          id="chat-input"
          placeholder="Ask a question..."
          rows="1"
        ></textarea>
        <button id="send-button" aria-label="Send">
          <img src="up-arrow-icon.webp" alt="Send">
        </button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>

  <script>
    const textarea = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');
    const chatWindow = document.getElementById('chat-window');

    const md = window.markdownit({
      breaks: true,
      linkify: true,
      html: false
    });

    function renderMarkdown(text) {
      return DOMPurify.sanitize(md.render(text || ''));
    }

    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    });

    sendButton.addEventListener('click', () => {
      handleSend();
    });

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    function appendMessage(role, text) {
  const row = document.createElement('div');
  row.className = `chat-row ${role}`;

  const bubble = document.createElement('div');
  bubble.className = `chat-bubble ${role}`;

  if (role === 'assistant') {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }

  row.appendChild(bubble);
  chatWindow.appendChild(row);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

    const API_URL = 'http://localhost:8000';

    async function handleSend() {
      const question = textarea.value.trim();
      if (!question) return;

      appendMessage('user', question);
      textarea.value = '';
      textarea.style.height = 'auto';

      const loadingMsg = document.createElement('div');
      loadingMsg.classList.add('chat-message', 'assistant');
      loadingMsg.textContent = 'Thinking...';
      chatWindow.appendChild(loadingMsg);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      try {
        const res = await fetch(`${API_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question }),
        });

        if (!res.ok) throw new Error(`Server error: ${res.status}`);

        const data = await res.json();
        loadingMsg.remove();

        if (data.error) {
          appendMessage('assistant', `**Error:** ${data.error}`);
        } else {
          appendMessage('assistant', data.answer);
        }
      } catch (err) {
        loadingMsg.innerHTML = renderMarkdown(`**Connection error** — is the API running?\n\n\`${err.message}\``);
      }
    }
  </script>
</body>
</html>
