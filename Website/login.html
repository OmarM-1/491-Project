<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotter AI - Guest</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="home-page">
  <header class="nav">
    <a href="home.html" class="logo">SpotterAI</a>
    <ul class="nav-links">
      <li><a href="guest.html">GuestBot</a></li>
    </ul>
  </header>

  <main class="page_guest">
    <section class="auth-panel">
      <h1>Welcome to SpotterAI</h1>
      <p>Log in or create an account to continue.</p>

      <form id="login-form" class="auth-form">
        <label for="login-email" class="sr-only">Email</label>
        <input id="login-email" type="email" placeholder="Email" autocomplete="email" required>

        <label for="login-password" class="sr-only">Password</label>
        <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>

        <button type="submit">Log in</button>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="signup.html" class="auth-link-button">Sign up</a>
      </p>

      <p id="auth-message" aria-live="polite"></p>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = 'https://ezowjohfkxvaajeqilkx.supabase.co';
    const supabaseAnonKey = 'sb_publishable__ajmqfcEBopf6B-aKLIzuw_XmyvssUq';
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    const authMessage = document.getElementById('auth-message');
    const loginForm = document.getElementById('login-form');

    async function ensureProfile(user) {
      if (!user) return;

      const username = user.email?.split('@')[0] ?? '';

      const { error } = await supabase
        .from('profiles')
        .upsert({
          id: user.id,
          full_name: '',
          username,
          avatar_url: ''
        });

      if (error) {
        console.error('Profile upsert failed:', error.message);
      }
    }

    async function redirectIfLoggedIn() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        console.error(error.message);
        return;
      }

      if (data.session) {
        window.location.href = 'member.html';
      }
    }

    loginForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      authMessage.textContent = 'Logging in...';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        authMessage.textContent = error.message;
        return;
      }

      await ensureProfile(data.user);
      window.location.href = 'member.html';
    });

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        window.location.href = 'member.html';
      }
    });

    redirectIfLoggedIn();
  </script>
</body>
</html>
